[project]
name = "agente-reembolso"
version = "0.3.0"
description = "Agente interno de reembolsos e cancelamentos com RAG modular (POC)"
requires-python = ">=3.11"
dependencies = []  # o núcleo usa só a biblioteca padrão

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn>=0.29"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
